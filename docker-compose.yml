services:
  booksync:
    build: .
    container_name: booksync
    environment:
      - TZ=${TZ:-Etc/UTC}
      - PORT=3000
      - BOOKSYNC_DATA_DIR=/config
      - BOOKSYNC_APP_PATH=/app
    volumes:
      - ${BOOKSYNC_CONFIG_PATH:-./config}:/config
      - Audiobooks:/downloads
    ports:
      - ${BOOKSYNC_PORT:-3015}:3000
    restart: unless-stopped

volumes:
  # Pre-existing named docker volume — managed outside this stack so a
  # `docker compose down -v` here can't wipe your audiobook library.
  Audiobooks:
    external: true
